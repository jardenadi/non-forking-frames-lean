name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs elan with the toolchain from lean-toolchain, runs `lake exe cache get`
      # (Mathlib cache) and `lake build`.
      - uses: leanprover/lean-action@v1.7.1
        with:
          use-mathlib-cache: true
          build: true
          test: false
          lint: false
